[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govia-agent-source"
version = "0.2.0"
description = "Real LangGraph agent for evidence-backed Git repository analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.3,<2",
  "langchain-openai>=0.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
govia-agent-source = "govia_agent_source.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
